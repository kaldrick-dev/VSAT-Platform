services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vsat
      POSTGRES_USER: vsat
      POSTGRES_PASSWORD: vsat
    ports:
      - "5433:5432"
    volumes:
      - vsat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vsat -d vsat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vsat_postgres_data:

